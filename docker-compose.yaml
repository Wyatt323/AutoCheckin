services:
  autocheckin:
    build: .
    image: autocheckin:local
    init: true
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      TRUST_PROXY: "false"
      AUTOCHECKIN_DATA_DIR: /data
      BIND_HOST: 0.0.0.0
      PUBLIC_HOST: 127.0.0.1
      PORT: "8765"
      PYTHON_BIN: /opt/venv/bin/python
      TZ: Asia/Shanghai
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: autocheckin
      PGUSER: autocheckin
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    stop_grace_period: 15s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autocheckin
      POSTGRES_USER: autocheckin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocheckin -d autocheckin"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
