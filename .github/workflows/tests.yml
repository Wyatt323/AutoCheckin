name: Offline tests
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autocheckin
          POSTGRES_PASSWORD: offline-ci-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autocheckin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUTOCHECKIN_TEST_DATABASE_URL: postgresql://autocheckin:offline-ci-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: node tests/run-tests.js
