<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#fff8f3"><title>登录 · AutoCheckin</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/auth.css"><link rel="stylesheet" href="/theme.css"><script src="/auth.js" defer></script></head>
<body class="auth-page"><main class="auth-layout"><section class="auth-brand" aria-label="AutoCheckin 自动签到工作空间"><a class="brand" href="/login"><span class="brand-icon">✦</span><span>Auto<span class="brand-accent">Checkin</span><small>YOUR DAILY AUTOMATION</small></span></a><div class="auth-wordmark" aria-hidden="true"><span>Auto</span><span>Check</span><span>in.</span></div><div class="auth-brand-footer"><span>让日常自动发生。</span><p>每一次签到，都轻松掌控。</p></div></section><section class="auth-panel"><div class="auth-stack"><div class="auth-emblem" aria-hidden="true">✦</div><div class="auth-card"><span class="auth-kicker">WELCOME TO YOUR WORKSPACE</span><h1>欢迎回来</h1><p class="auth-intro">登录 AutoCheckin 管理后台</p><form id="auth-form"><div id="auth-username-field"><label for="auth-username">用户名</label><div class="auth-input-wrap"><input id="auth-username" name="username" value="admin" autocomplete="username" required maxlength="32" placeholder="管理员创建的用户名"></div></div><label for="admin-password" id="auth-password-label">密码</label><div class="auth-input-wrap"><input id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required maxlength="4096" autofocus aria-describedby="auth-error"><button id="auth-reveal" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div><div id="auth-new-fields" hidden><label for="auth-new-password">新密码</label><div class="auth-input-wrap"><input id="auth-new-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="至少 8 位"></div><label for="auth-confirm-password">确认新密码</label><div class="auth-input-wrap"><input id="auth-confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="再次输入新密码"></div></div><p id="auth-error" class="auth-error" role="alert" aria-live="polite"></p><button id="auth-submit" class="auth-submit" type="submit">登录工作空间 <span aria-hidden="true">↗</span></button></form><div class="auth-note"><span aria-hidden="true">◇</span><p>本站不开放注册，请联系管理员创建账号。<br>首次登录必须修改默认密码。</p></div></div><p class="auth-footnote">AUTO CHECKIN · 简单，有序，自动化。</p></div></section></main></body></html>
